_templates_suffix: .jinja

project_name:
  type: str
  help: Human-readable project name

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') }}"
  help: Repository and package name (lowercase, hyphens)

kind:
  type: str
  default: study
  help: Project kind (study, library, evidence, or a future kind)

purpose:
  type: str
  choices:
    - academic_publication
    - dissertation
    - consulting
    - open_source_tool
    - side_project
  help: What this project is for

confidentiality:
  type: str
  choices:
    - public
    - private_until_release
    - confidential
  help: Confidentiality class. Confidential repos stay private and never publish raw or client material.

author:
  type: str
  help: Name used for the license and citation

copyright_year:
  type: str
  default: "2026"
  help: Year for the license notice

reprokit_requirement:
  type: str
  default: reprokit @ git+https://github.com/AaronScherf/reprokit@v0.3.2
  help: How this repo installs reprokit (a version, or a git URL pinned to a tag)

screening_pipeline:
  type: bool
  default: false
  when: "{{ kind == 'evidence' }}"
  help: Add the AI screening and extraction pipeline (extraction schema, extraction records, compute.yaml, agents.yaml)?

# Copier's defaults, plus kind-specific paths. Each templated line renders to a
# pattern or to an empty line (which matches nothing).
_exclude:
  - copier.yaml
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  # Evidence-only paths stay out of every other kind.
  - "{% if kind != 'evidence' %}/evidence{% endif %}"
  - "{% if kind != 'evidence' %}/synthesis.md{% endif %}"
  # Study scaffolding stays out of evidence repos.
  - "{% if kind == 'evidence' %}/data{% endif %}"
  # The minimal evidence tier has no extraction pipeline or AI/compute files.
  - "{% if kind == 'evidence' and not screening_pipeline %}/evidence/extraction_schema.yaml{% endif %}"
  - "{% if kind == 'evidence' and not screening_pipeline %}/evidence/extractions{% endif %}"
  - "{% if kind == 'evidence' and not screening_pipeline %}/compute.yaml{% endif %}"
  - "{% if kind == 'evidence' and not screening_pipeline %}/agents.yaml{% endif %}"
