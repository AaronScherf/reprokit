[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reprokit"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["jsonschema", "pyyaml"]

[project.scripts]
reprokit = "reprokit.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "copier"]

[tool.hatch.build.targets.wheel]
packages = ["src/reprokit"]
